name: Unit tests

on:
  push:
    branches: [master]
    paths:
      - 'sympde/**'
      - 'pyproject.toml'
      - '.github/workflows/continuous-integration.yml'
  pull_request:
    branches: [master]
    paths:
      - 'sympde/**'
      - 'pyproject.toml'
      - '.github/workflows/continuous-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python-version: '3.9'}
          - {os: ubuntu-24.04, python-version: '3.10'}
          - {os: ubuntu-24.04, python-version: '3.11'}
          - {os: ubuntu-24.04, python-version: '3.12'}
          - {os: ubuntu-24.04, python-version: '3.13'}
          - {os: ubuntu-24.04, python-version: '3.14'}
          - {os: macos-14, python-version: '3.10'}
          - {os: macos-14, python-version: '3.12'}
          - {os: macos-14, python-version: '3.14'}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Run tests from outside the source tree
        working-directory: ${{ runner.temp }}
        run: >-
          python -m pytest -n auto --dist loadgroup
          --pyargs sympde -ra

  coverage:
    name: Coverage / Python 3.14
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Run tests with coverage
        working-directory: ${{ runner.temp }}
        run: >-
          python -m pytest -n auto --dist loadgroup
          --cov sympde --cov-report term-missing --cov-report xml
          --pyargs sympde -ra

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage.xml
