# This workflow installs SymPDE and runs its tests with supported Python versions.
# It follows the testing layout used by Psydac while omitting Psydac-specific
# MPI, HDF5, PETSc, and example jobs.

name: Unit tests

on:
  push:
    branches: [ master ]
    paths:
      - 'sympde/**'
      - 'pyproject.toml'
      - '.github/workflows/testing.yml'

  pull_request:
    branches: [ master ]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        python-version: [ '3.9', '3.10', '3.11', '3.12', '3.13', '3.14' ]

    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          pyproject.toml

    - name: Upgrade pip, setuptools, and wheel
      run: |
        pip install --upgrade pip setuptools wheel

    - name: Install project
      run: |
        pip install .[test]
        pip freeze

    - name: Initialize test directory
      run: |
        mkdir scratch

    - name: Run coverage tests on macOS
      if: runner.os == 'macOS'
      working-directory: ./scratch
      run: >-
        pytest -n auto --dist loadgroup
        --cov sympde --cov-report term-missing --cov-report xml
        --pyargs sympde -ra

    - name: Run tests on Ubuntu
      if: runner.os == 'Linux'
      working-directory: ./scratch
      run: >-
        pytest -n auto --dist loadgroup
        --pyargs sympde -ra

    - name: Upload coverage report
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.os }}-python-${{ matrix.python-version }}
        path: scratch/coverage.xml

    - name: Print detailed coverage results on macOS
      if: runner.os == 'macOS'
      working-directory: ./scratch
      run: |
        coverage report --ignore-errors --show-missing --sort=cover
