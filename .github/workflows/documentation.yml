name: Documentation

on:
  push:
    branches: [ master ]
    paths:
      - 'README.md'
      - 'doc/**'
      - 'sympde/**.py'
      - 'pyproject.toml'
      - '.github/workflows/documentation.yml'

  pull_request:
    branches: [ master ]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: |
          pyproject.toml

    - name: Upgrade pip, setuptools, and wheel
      run: |
        pip install --upgrade pip setuptools wheel

    - name: Install project and documentation dependencies
      run: |
        pip install .[docs]
        pip freeze

    - name: Make the Sphinx documentation
      run: >-
        python -m sphinx -W --keep-going
        -b html doc doc/_build/html

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'doc/_build/html'

  deploy_docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build_docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
