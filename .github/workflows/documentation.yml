name: Documentation

on:
  push:
    branches: [ master ]
    paths:
      - 'README.rst'
      - 'doc/**'
      - 'sympde/**.py'
      - 'pyproject.toml'
      - '.readthedocs.yaml'
      - '.github/workflows/documentation.yml'

  pull_request:
    branches: [ master ]
    types:
      - ready_for_review

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: |
          pyproject.toml

    - name: Upgrade pip, setuptools, and wheel
      run: |
        pip install --upgrade pip setuptools wheel

    - name: Install project and documentation dependencies
      run: |
        pip install .[docs]
        pip freeze

    - name: Make the Sphinx documentation
      run: >-
        python -m sphinx -W --keep-going
        -b html doc doc/_build/html

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: sympde-documentation
        path: 'doc/_build/html'
